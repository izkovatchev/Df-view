<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three Points and Circumcircle</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1020;
      color: #e8ecff;
    }
    .wrap {
      width: min(92vw, 780px);
      padding: 18px;
      border-radius: 16px;
      background: rgba(18, 27, 53, 0.9);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.1rem;
    }
    p {
      margin: 0 0 10px;
      color: #c8d2ff;
      font-size: 0.95rem;
    }
    canvas {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      background: #0f1833;
      touch-action: none;
      display: block;
    }
    #status {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #b8c5ff;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Drag 3 points inside the unit circle</h1>
    <p>The circumcircle updates live from the three selected points.</p>
    <canvas id="plot" width="720" height="720" aria-label="unit circle plot"></canvas>
    <div id="status" role="status"></div>
  </main>

  <script>
    const canvas = document.getElementById('plot');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    const worldRadius = 1;
    const scale = canvas.width * 0.42;
    const origin = { x: canvas.width / 2, y: canvas.height / 2 };
    const pointRadiusPx = 10;
    const pointHitRadiusPx = 24;

    const points = [
      { x: -0.45, y: -0.2, color: '#6be675' },
      { x: 0.55, y: -0.3, color: '#f5dc4b' },
      { x: 0.2, y: 0.62, color: '#58c8ff' }
    ];

    let dragIndex = -1;

    function toScreen(pt) {
      return {
        x: origin.x + pt.x * scale,
        y: origin.y - pt.y * scale
      };
    }

    function toWorld(px, py) {
      return {
        x: (px - origin.x) / scale,
        y: (origin.y - py) / scale
      };
    }

    function clampToUnitDisk(p) {
      const d = Math.hypot(p.x, p.y);
      if (d <= worldRadius || d === 0) return p;
      return { x: p.x / d, y: p.y / d };
    }

    function circumcircle(a, b, c) {
      const d = 2 * (a.x * (b.y - c.y) + b.x * (c.y - a.y) + c.x * (a.y - b.y));
      if (Math.abs(d) < 1e-8) return null;

      const a2 = a.x * a.x + a.y * a.y;
      const b2 = b.x * b.x + b.y * b.y;
      const c2 = c.x * c.x + c.y * c.y;

      const ux = (a2 * (b.y - c.y) + b2 * (c.y - a.y) + c2 * (a.y - b.y)) / d;
      const uy = (a2 * (c.x - b.x) + b2 * (a.x - c.x) + c2 * (b.x - a.x)) / d;
      const r = Math.hypot(a.x - ux, a.y - uy);

      return { center: { x: ux, y: uy }, r };
    }

    function drawGrid() {
      ctx.save();
      ctx.strokeStyle = 'rgba(140,160,220,0.22)';
      ctx.lineWidth = 1;
      for (let i = -4; i <= 4; i++) {
        const x = origin.x + i * scale * 0.25;
        const y = origin.y + i * scale * 0.25;
        ctx.beginPath();
        ctx.moveTo(x, origin.y - scale);
        ctx.lineTo(x, origin.y + scale);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(origin.x - scale, y);
        ctx.lineTo(origin.x + scale, y);
        ctx.stroke();
      }
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawGrid();

      // unit circle
      ctx.beginPath();
      ctx.arc(origin.x, origin.y, scale * worldRadius, 0, Math.PI * 2);
      ctx.strokeStyle = '#d4deff';
      ctx.lineWidth = 2;
      ctx.stroke();

      // triangle
      ctx.beginPath();
      const p0 = toScreen(points[0]);
      ctx.moveTo(p0.x, p0.y);
      for (let i = 1; i < points.length; i++) {
        const p = toScreen(points[i]);
        ctx.lineTo(p.x, p.y);
      }
      ctx.closePath();
      ctx.strokeStyle = 'rgba(216,226,255,0.75)';
      ctx.lineWidth = 1.8;
      ctx.stroke();

      const cc = circumcircle(points[0], points[1], points[2]);
      if (cc) {
        const c = toScreen(cc.center);
        ctx.beginPath();
        ctx.arc(c.x, c.y, cc.r * scale, 0, Math.PI * 2);
        ctx.strokeStyle = '#ff7ca8';
        ctx.lineWidth = 2.4;
        ctx.stroke();

        statusEl.textContent = `Circumcenter: (${cc.center.x.toFixed(3)}, ${cc.center.y.toFixed(3)}) | radius: ${cc.r.toFixed(3)}`;
      } else {
        statusEl.textContent = 'Points are almost collinear, so the circumcircle is undefined.';
      }

      points.forEach((pt, i) => {
        const sp = toScreen(pt);
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, pointRadiusPx, 0, Math.PI * 2);
        ctx.fillStyle = pt.color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#0f1833';
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(i + 1), sp.x, sp.y + 0.5);
      });
    }

    function getPointerPos(evt) {
      const rect = canvas.getBoundingClientRect();
      const source = evt.touches ? evt.touches[0] : evt;
      return {
        x: source.clientX - rect.left,
        y: source.clientY - rect.top
      };
    }

    function findPointAt(px, py) {
      for (let i = points.length - 1; i >= 0; i--) {
        const sp = toScreen(points[i]);
        if (Math.hypot(px - sp.x, py - sp.y) <= pointHitRadiusPx) return i;
      }
      return -1;
    }

    function pointerDown(evt) {
      evt.preventDefault();
      const { x, y } = getPointerPos(evt);
      dragIndex = findPointAt(x, y);
    }

    function pointerMove(evt) {
      if (dragIndex < 0) return;
      evt.preventDefault();
      const { x, y } = getPointerPos(evt);
      points[dragIndex] = clampToUnitDisk(toWorld(x, y));
      draw();
    }

    function pointerUp() {
      dragIndex = -1;
    }

    canvas.addEventListener('mousedown', pointerDown);
    canvas.addEventListener('mousemove', pointerMove);
    window.addEventListener('mouseup', pointerUp);

    canvas.addEventListener('touchstart', pointerDown, { passive: false });
    canvas.addEventListener('touchmove', pointerMove, { passive: false });
    window.addEventListener('touchend', pointerUp);

    draw();
  </script>
</body>
</html>
